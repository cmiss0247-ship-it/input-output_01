<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            text-align: center;
        }

        tr,
        td {

            border: 1px solid black;

        }

        /* tr:hover {

            border: 1px solid black;
            
        } */

        tr:hover,
        td:hover {
            background-color: rgb(163, 116, 206);
        }

        .price::before {
            content: '$';
        }

        .price::before {
            content: 'NT';
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td width="15%">
                ID
            </td>
            <td width="15%">
                名稱
            </td>
            <td>
                價格
            </td>
        </tr>


        <tr>
            <td>
                1
            </td>
            <td>
                咖啡
            </td>
            <td class="price">
                100
            </td>
        </tr>


        <tr>
            <td>
                2
            </td>
            <td>
                花茶
            </td>
            <td class="price">
                200
            </td>
        </tr>
    </table>

</body>

</html>
