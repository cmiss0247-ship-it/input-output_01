<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: #e2bebe;
        }

        .box>img {
            width: 100px;
            height: 100px;
        }

        .box1 {
            background-color: #9ae6cc;
        }

        .box2 {
            background-color: #ffc99d;
            background-image: url(https://picsum.photos/300/300/?blur=2);
            background-repeat: no-repeat;
        }

        .box3 {
            background-color: #c5fdaf;
            background-image: url(https://picsum.photos/200/300.webp);
            background-repeat: no-repeat;
            
            /* bg-size cover contain */
            background-size: cover;
        }


    </style>
</head>
<body>
    <div class="box box1">
        <img src="https://picsum.photos/seed/picsum/200/200" alt="">
    </div>

    <br>

    <div class="box box2">
    </div>

    <div class="box box3">        
    </div>
    
</body>
</html>
