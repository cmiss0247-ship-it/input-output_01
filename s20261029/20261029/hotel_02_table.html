
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旭集｜美食相簿</title>

    <style>
        /* ① 全站基本設定 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f7f4ee;
            color: #302b26;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
        }

        /* ② 頁首 */
        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 12px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 12px;
            letter-spacing: 3px;
            color: #8b7966;
        }

        /* ③ 導覽列 */
        nav {
            margin-top: 30px;
        }

        nav a {
            color: #302b26;
            text-decoration: none;
            margin: 0 20px;
        }

        nav a:hover {
            color: #a47d52;
        }

        /* ④ 相簿標題 */
        .gallery-title {
            text-align: center;
            margin: 30px 0 45px;
        }

        .gallery-title h2 {
            font-size: 32px;
            letter-spacing: 6px;
        }

        .gallery-title p {
            color: #8b7966;
            font-size: 12px;
            letter-spacing: 3px;
        }

        /* ⑤ 三欄相簿排版 */
        .gallery {
            width: 85%;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* ⑥ 圖片設定 */
        .gallery img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item {
            text-align: center;
        }

        .item p {
            font-size: 16px;
            letter-spacing: 3px;
            margin: 15px 0 35px;
        }

        /* ⑦ 手機版改成一欄 */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>旭集</h1>
        <p>SUNRISE ● JAPANESE DINING</p>

        <nav>
            <a href="./20261029_01_hotel_index.html">首頁</a>
            <a href="./hotel_04_table.html">料理介紹</a>
            <a href="./hotel_02_table.html">美食相簿</a>
        </nav>
    </header>

    <main>
        <div class="gallery-title">
            <h2>美食相簿</h2>
            <p>JAPANESE CUISINE GALLERY</p>
        </div>

        <div class="gallery">

            <div class="item">
                <img src="./images/img01.jpeg" alt="日式料理">
                <p>刺身料理</p>
            </div>

            <div class="item">
                <img src="./images/img02.jpeg" alt="炭烤料理">
                <p>炭烤料理</p>
            </div>

            <div class="item">
                <img src="./images/img08.jpeg" alt="壽司料理">
                <p>壽司料理</p>
            </div>

            <div class="item">
                <img src="./images/img07.jpeg" alt="天婦羅">
                <p>天婦羅</p>
            </div>

            <div class="item">
                <img src="./images/img11.jpeg" alt="炙燒料理">
                <p>炙燒料理</p>
            </div>

            <div class="item">
                <img src="./images/img12.jpeg" alt="日式甜點">
                <p>日式甜點</p>
            </div>

        </div>
    </main>

</body>

</html>
