<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #link {
            color: black;
            text-decoration: none;
            transition: all 1s;
            /* transition: color 3s, background 1s; 慢慢變色效果 */
            display: inline-block;

        }

        #link:hover {
            color: blueviolet !important;
            background: gray;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <a id="link">Home</a>
    
</body>
</html>
