<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      width: 100px;
      height: 100px;
      background: gray;
      /*
        外在行為是 inline，跟別人排一起
        內在行為維持 block
        inline block 會因為 html 排版而有神奇的間距
      */
      display: inline-block;
    }
    span {
      width: 100px;
      height: 100px;
      background: gray;
      /*
        不顯示
      */
      display: none;
    }
  </style>
</head>
<body>
  <!-- 
    div 沒有預設樣式的 block 標籤
    - 可以設定寬高尺寸
    - 預設佔滿整行寬度，就算寬高樣式沒有佔滿，後面的東西也是會在下一行
  -->
  <div>123456</div>
  <div>123456</div>
  <!--
    span 沒有預設樣式的 inline 標籤
    - 不能設定寬高尺寸，尺寸是由內容撐開
    - 東西會排在同一行
  -->
  <span>123456</span>
  <span>123456</span>
</body>
</html>
