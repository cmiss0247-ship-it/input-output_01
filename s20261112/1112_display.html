<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            background: purple;
            display: inline-block;
            text-align: center;
            /* 裡面文字會置中 */
        }

        span {
            width: 100px;
            height: 100px;
            background: gray;
            display: none;
        }
    </style>
</head>

<body>
    <!-- <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQD2yMmDiEGn0QFYOaxGqNN90QtViVOU9gIIsH6fQVUJdbCvkWm2Mqm3Ob0&s=10" alt="狗狗"> -->
    <!-- div 沒有預設樣式的 block 標籤
     可以設定寬高尺寸
     預設占滿整行寬度，就算寬高樣式沒有占滿，後面的東西也是會在下一行 -->

    <div>123456789</div>
    <div>123456789</div>
    <!-- sapn沒有預設樣式的 inline 標籤
    不能設定寬高尺寸，尺寸由內撐開
    東西會排在同一行 -->
    <span>123456</span>
    <span>123456</span>

</body>

</html>
