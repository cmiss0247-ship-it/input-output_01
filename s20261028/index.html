<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活用品購物清單</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;900&display=swap');

        * { box-sizing: border-box; }

        :root {
            --lavender-grey: #a09abc;
            --lilac: #b6a6ca;
            --lavender: #d5cfe1;
            --lavender-2: #e1dee9;
            --almond-silk: #d4bebe;
            --ink: #3d3650;
            --paper: #f3f0f7;
            --cat: #1f1a28;
        }

        html, body { overflow-x: hidden; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 16px;
            background: var(--lavender-2);
            font-family: 'Courier Prime', 'Noto Sans TC', monospace;
            color: var(--ink);
            position: relative;
        }

        /* ===================== 背景層（流動全息液體） ===================== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #e6dcf5;
        }

        /* 液體漸層：色彩取自參考圖，背景位置持續流動 */
        .liquid {
            position: absolute;
            inset: -10%;
            background: linear-gradient(
                115deg,
                #d9c9f5 0%,
                #f2d6f5 16%,
                #ffd0e6 28%,
                #c8f2ea 42%,
                #bfe6ff 56%,
                #e4d4fb 70%,
                #f9e6ff 84%,
                #cdb8f2 100%
            );
            background-size: 300% 300%;
            animation: flow 14s ease-in-out infinite alternate;
            filter: url(#liquid);
        }

        @keyframes flow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 30%; }
            100% { background-position: 40% 100%; }
        }

        /* 白色高光，緩慢移動，增加光澤感 */
        .sheen {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.75), transparent 45%),
                radial-gradient(circle at 75% 80%, rgba(255, 255, 255, 0.55), transparent 40%);
            mix-blend-mode: soft-light;
            animation: sheenMove 10s ease-in-out infinite alternate;
        }

        @keyframes sheenMove {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-6%, 8%); }
        }

        /* 紫色球體（沿用，色調配合背景） */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #ffffff 0%, #efe8ff 28%, #c9b8f0 62%, #9d8ad0 100%);
            box-shadow:
                inset -14px -18px 28px rgba(60, 50, 90, 0.25),
                inset 10px 10px 16px rgba(255, 255, 255, 0.6),
                8px 10px 0 rgba(61, 54, 80, 0.10);
            animation: float ease-in-out infinite alternate;
        }

        @keyframes float {
            from { transform: translate(0, 0) rotate(0deg); }
            to   { transform: translate(18px, -26px) rotate(12deg); }
        }

        /* ===================== 前景內容（蓋在貓咪之上） ===================== */
        .content {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 大標題：每個字可單獨變色（Coolors 首頁風格） */
        h1 {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 8vw, 4.6rem);
            line-height: 1.15;
            margin: 0 auto 14px;
            color: var(--ink);
            letter-spacing: 0.04em;
            text-align: center;
            user-select: none;
        }

        .title-char {
            display: inline-block;
            cursor: default;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .title-char:hover {
            transform: translateY(-6px) scale(1.06);
        }

        /* 八個字依序使用的顏色（取自 Coolors 首頁的鮮明色系） */
        .title-char:nth-child(8n+1):hover { color: #ff6b6b; }
        .title-char:nth-child(8n+2):hover { color: #ffd166; }
        .title-char:nth-child(8n+3):hover { color: #06d6a0; }
        .title-char:nth-child(8n+4):hover { color: #118ab2; }
        .title-char:nth-child(8n+5):hover { color: #8338ec; }
        .title-char:nth-child(8n+6):hover { color: #ef476f; }
        .title-char:nth-child(8n+7):hover { color: #073b4c; }
        .title-char:nth-child(8n+8):hover { color: #ff9f1c; }

        .sub {
            text-align: center;
            margin: 0 0 12px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .top-count {
            display: block;
            width: fit-content;
            margin: 0 auto 32px;
            padding: 4px 16px;
            background: var(--almond-silk);
            color: var(--ink);
            font-weight: 900;
            box-shadow: 4px 4px 0 var(--lilac);
        }

        /* ===================== 共用面板 ===================== */
        .panel {
            width: 100%;
            background: var(--lavender);
            padding: 18px 20px;
            margin-bottom: 24px;
            border: 3px solid var(--ink);
            box-shadow: 10px 8px 0 var(--lavender-grey);
            position: relative;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--lilac);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .panel-head h2 {
            margin: 0;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--ink);
        }

        .cnt {
            font-size: 0.8rem;
            font-weight: 900;
            background: var(--almond-silk);
            color: var(--ink);
            padding: 2px 10px;
            white-space: nowrap;
        }

        /* ===================== 我的購買清單（頂部橫列） ===================== */
        .purchase {
            background: var(--almond-silk);
            box-shadow: 10px 8px 0 var(--lavender-grey);
        }

        .need-count {
            font-weight: 900;
            font-size: 0.9rem;
            background: var(--lavender-grey);
            color: #fff;
            padding: 4px 12px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .chips li {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--lavender-2);
            padding: 4px 10px;
            font-size: 0.92rem;
        }

        .need-tag {
            font-size: 0.7rem;
            font-weight: 900;
            background: var(--lilac);
            color: #fff;
            padding: 1px 6px;
        }

        .btn-x {
            background: transparent;
            color: var(--ink);
            border: none;
            padding: 0 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-x:hover { color: var(--lavender-grey); }

        .empty-msg {
            font-size: 0.95rem;
            font-weight: 700;
            background: var(--lavender-2);
            padding: 10px;
        }

        .copy-row {
            margin-top: 14px;
            text-align: right;
        }

        /* ===================== 按鈕 ===================== */
        button {
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .btn-main {
            padding: 8px 18px;
            background: var(--lavender-grey);
            color: #fff;
        }

        .btn-main:hover { background: var(--ink); }

        /* ===================== 分類卡片 ===================== */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .catalog .panel { margin-bottom: 0; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 6px 10px;
        }

        .chk {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.92rem;
            cursor: pointer;
            user-select: none;
            padding: 3px 4px;
        }

        .chk input {
            width: 16px;
            height: 16px;
            accent-color: var(--lavender-grey);
            cursor: pointer;
            flex-shrink: 0;
        }

        .chk:hover { color: var(--lavender-grey); }

        /* ===================== 其他類（橫跨全寬） ===================== */
        .other-panel { margin-top: 24px; }

        .other-panel .grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }

        .custom-add {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px solid var(--lilac);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .custom-add label {
            font-weight: 900;
            white-space: nowrap;
        }

        /* 輸入框：無粗框、無色塊，只保留底線 */
        .custom-add input {
            flex: 1;
            min-width: 0;
            padding: 6px 2px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--lilac);
            border-radius: 0;
            outline: none;
        }

        .custom-add input::placeholder { color: var(--lavender-grey); }

        .custom-add input:focus {
            border-bottom-color: var(--lavender-grey);
        }

        .custom-hint {
            font-size: 0.8rem;
            margin: 8px 0 0;
            color: var(--lavender-grey);
        }

        /* ===================== 黑貓吉祥物（位於內容後方） ===================== */
        .cat {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 160px;
            z-index: 0;
            cursor: pointer;
        }

        .c-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 200px;
            height: 160px;
            overflow: visible;
            filter: drop-shadow(4px 5px 0 rgba(61, 54, 80, 0.18));
        }

        .c-leg { transition: transform 0.35s ease, opacity 0.35s ease; }
        .c-b1 { transform-origin: 80px 126px; }
        .c-b2 { transform-origin: 71px 126px; }
        .c-f1 { transform-origin: 122px 126px; }
        .c-f2 { transform-origin: 129px 126px; }

        .c-tail {
            transform-origin: 50px 128px;
            animation: cwag 2.2s ease-in-out infinite alternate;
            transition: transform 0.35s ease;
        }

        .c-body {
            transform-origin: 100px 140px;
            transition: transform 0.35s ease;
        }

        .c-head {
            transform-origin: 150px 90px;
            transition: transform 0.35s ease;
        }

        .c-eyes-shut { display: none; }

        .c-zzz {
            position: absolute;
            left: 162px;
            top: 0;
            display: none;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--lavender-grey);
            pointer-events: none;
            animation: czz 2.4s ease-out infinite;
        }

        /* 冷笑話泡泡：位於貓咪內部，會與貓一起被內容遮住 */
        .c-bubble {
            position: absolute;
            left: 50%;
            bottom: 170px;
            width: max-content;
            max-width: 230px;
            padding: 10px 12px;
            background: var(--paper);
            border: 3px solid var(--ink);
            box-shadow: 5px 5px 0 var(--lavender-grey);
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
            color: var(--ink);
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(6px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 30;
        }
        .c-bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 狀態：走路 */
        .cat[data-state="walk"] .c-b1,
        .cat[data-state="walk"] .c-f2 {
            animation: cstepA 0.5s ease-in-out infinite alternate;
        }
        .cat[data-state="walk"] .c-b2,
        .cat[data-state="walk"] .c-f1 {
            animation: cstepB 0.5s ease-in-out infinite alternate;
        }
        .cat[data-state="walk"] .c-body {
            animation: cbob 0.5s ease-in-out infinite alternate;
        }

        /* 狀態：舔毛 */
        .cat[data-state="groom"] .c-head {
            transform: translate(2px, 6px) rotate(8deg);
        }
        .cat[data-state="groom"] .c-f1 {
            animation: click 0.9s ease-in-out infinite;
        }

        /* 狀態：趴下與睡覺 */
        .cat[data-state="lie"] .c-body,
        .cat[data-state="sleep"] .c-body {
            transform: scale(1.14, 0.62);
        }
        .cat[data-state="lie"] .c-leg,
        .cat[data-state="sleep"] .c-leg {
            opacity: 0;
        }
        .cat[data-state="lie"] .c-head,
        .cat[data-state="sleep"] .c-head {
            transform: translate(-6px, 34px) rotate(12deg);
        }
        .cat[data-state="lie"] .c-tail,
        .cat[data-state="sleep"] .c-tail {
            animation: none;
            transform: rotate(-28deg);
        }

        /* 狀態：睡覺 */
        .cat[data-state="sleep"] .c-body {
            animation: cbreathe 2.4s ease-in-out infinite alternate;
        }
        .cat[data-state="sleep"] .c-eyes-open { display: none; }
        .cat[data-state="sleep"] .c-eyes-shut { display: inline; }
        .cat[data-state="sleep"] .c-zzz { display: block; }

        /* 狀態：跳躍 */
        .cat[data-state="jump"] .c-body {
            transform: scale(0.96, 1.08);
        }
        .cat[data-state="jump"] .c-f1,
        .cat[data-state="jump"] .c-f2 {
            transform: rotate(-22deg);
        }
        .cat[data-state="jump"] .c-b1,
        .cat[data-state="jump"] .c-b2 {
            transform: rotate(22deg);
        }
        .cat[data-state="jump"] .c-tail {
            animation: none;
            transform: rotate(18deg);
        }

        /* 關鍵影格 */
        @keyframes cstepA {
            from { transform: rotate(-14deg); }
            to   { transform: rotate(14deg); }
        }
        @keyframes cstepB {
            from { transform: rotate(14deg); }
            to   { transform: rotate(-14deg); }
        }
        @keyframes cbob {
            from { transform: translateY(0); }
            to   { transform: translateY(-2px); }
        }
        @keyframes cwag {
            from { transform: rotate(-4deg); }
            to   { transform: rotate(14deg); }
        }
        @keyframes click {
            0%, 100% { transform: rotate(-100deg); }
            50%      { transform: rotate(-116deg); }
        }
        @keyframes cbreathe {
            from { transform: scale(1.14, 0.62); }
            to   { transform: scale(1.14, 0.66); }
        }
        @keyframes czz {
            0%   { opacity: 0; transform: translate(0, 0); }
            50%  { opacity: 1; }
            100% { opacity: 0; transform: translate(14px, -22px); }
        }
    </style>
</head>
<body>
    <!-- 液體扭曲濾鏡（SVG） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="2" seed="3">
                <animate attributeName="baseFrequency" dur="18s"
                         values="0.004 0.009;0.007 0.004;0.004 0.009" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="120"/>
        </filter>
    </svg>

    <!-- 背景（流動全息液體 + 紫色球體） -->
    <div class="bg-layer" id="bg">
        <div class="liquid"></div>
        <div class="sheen"></div>
        <div class="orb" style="width:180px;height:180px;left:6%;top:12%;animation-duration:7s;"></div>
        <div class="orb" style="width:90px;height:90px;left:78%;top:8%;animation-duration:5s;"></div>
        <div class="orb" style="width:120px;height:120px;left:85%;top:62%;animation-duration:8s;"></div>
        <div class="orb" style="width:60px;height:60px;left:14%;top:78%;animation-duration:6s;"></div>
        <div class="orb" style="width:140px;height:140px;left:48%;top:86%;animation-duration:9s;"></div>
    </div>

    <div class="content">
        <!-- 大標題：每個字由 JavaScript 拆分，游標移過去會變色 -->
        <h1 id="title">生活用品購物清單</h1>
        <p class="sub">勾選你平常會購買的物品</p>
        <div class="top-count"><span id="total">0</span> 項已選</div>

        <!-- 我的購買清單（頂部橫列） -->
        <section class="panel purchase">
            <div class="panel-head">
                <h2>我的購買清單</h2>
                <span class="need-count">需採買：<span id="needCount">0</span> 項</span>
            </div>
            <div id="output"></div>
            <div class="copy-row">
                <button type="button" class="btn-main" id="copyBtn">複製清單</button>
            </div>
        </section>

        <!-- 分類卡片 -->
        <div class="catalog" id="catalog"></div>

        <!-- 其他類（橫跨全寬，含自訂新增） -->
        <section class="panel other-panel">
            <div class="panel-head">
                <h2>其他類</h2>
                <span class="cnt" id="cnt-other">0 項</span>
            </div>
            <div class="grid" id="grid-other"></div>
            <div class="custom-add">
                <label for="customInput">新增品項</label>
                <input type="text" id="customInput" placeholder="輸入品項名稱後按 Enter 或新增">
                <button type="button" class="btn-main" id="addBtn">新增</button>
            </div>
            <p class="custom-hint">新增的品項會歸入「其他類」並自動勾選。</p>
        </section>
    </div>

    <!-- 黑貓吉祥物 -->
    <div class="cat" id="cat" data-state="sit">
        <div class="c-bubble" id="bubble"></div>
        <div class="c-zzz">Z<span>z</span></div>

        <svg class="c-svg" id="catSvg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="100" cy="152" rx="60" ry="5" fill="#3d3650" opacity="0.2"/>

            <path class="c-tail" d="M50 128 C20 130 14 100 22 84" fill="none" stroke="#1f1a28" stroke-width="10" stroke-linecap="round"/>

            <rect class="c-leg c-b2" x="62" y="124" width="18" height="28" rx="9" fill="#15111d"/>
            <rect class="c-leg c-f2" x="120" y="124" width="18" height="28" rx="9" fill="#15111d"/>

            <g class="c-body">
                <ellipse cx="100" cy="112" rx="48" ry="30" fill="#1f1a28"/>
            </g>

            <rect class="c-leg c-b1" x="70" y="124" width="20" height="28" rx="10" fill="#1f1a28"/>
            <rect class="c-leg c-f1" x="112" y="124" width="20" height="28" rx="10" fill="#1f1a28"/>

            <g class="c-head">
                <polygon points="126,58 130,22 152,44" fill="#1f1a28"/>
                <polygon points="148,44 172,22 174,60" fill="#1f1a28"/>
                <polygon points="132,50 134,34 146,46" fill="#9f8fc0" opacity="0.5"/>
                <polygon points="157,46 167,32 170,52" fill="#9f8fc0" opacity="0.5"/>

                <circle cx="150" cy="74" r="30" fill="#1f1a28"/>

                <g class="c-eyes-open">
                    <ellipse cx="138" cy="72" rx="9" ry="10" fill="#e6ef7a"/>
                    <ellipse cx="138" cy="72" rx="3" ry="7" fill="#0d0b12"/>
                    <circle cx="140" cy="68" r="1.6" fill="#ffffff"/>

                    <ellipse cx="163" cy="70" rx="9" ry="10" fill="#e6ef7a"/>
                    <ellipse cx="163" cy="70" rx="3" ry="7" fill="#0d0b12"/>
                    <circle cx="165" cy="66" r="1.6" fill="#ffffff"/>
                </g>

                <g class="c-eyes-shut">
                    <path d="M130 74 Q138 82 146 74" stroke="#e6ef7a" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M155 72 Q163 80 171 72" stroke="#e6ef7a" stroke-width="3" fill="none" stroke-linecap="round"/>
                </g>

                <path d="M147 84 L153 84 L150 88 Z" fill="#f08aa0"/>
                <path d="M150 88 Q147 92 143 90 M150 88 Q153 92 157 90" stroke="#0d0b12" stroke-width="1.6" fill="none" stroke-linecap="round"/>

                <path d="M136 88 L120 86 M136 93 L120 95 M164 88 L180 86 M164 93 L180 95" stroke="#3d3650" stroke-width="1" opacity="0.6"/>
            </g>
        </svg>
    </div>

    <script>
        // ===================== 大標題：拆成單字，游標移過去變色 =====================
        const titleEl = document.getElementById('title');
        const titleText = titleEl.textContent;
        titleEl.textContent = '';
        [...titleText].forEach(ch => {
            const s = document.createElement('span');
            s.className = 'title-char';
            s.textContent = ch;
            titleEl.appendChild(s);
        });

        // ===================== 購物清單資料 =====================
        const CATALOG = [
            { id: 'food', title: '食類', items: ['白米','麵條','吐司','雞蛋','牛奶','豆漿','蔬菜','水果','肉類','冷凍食品','泡麵','餅乾','咖啡／茶','食用油','鹽／糖／醬油'] },
            { id: 'cloth', title: '衣類', items: ['上衣','褲子','裙子','外套','內衣','內褲','襪子','鞋子','包包','髮圈／髮夾','洗衣精','柔軟精','去漬劑'] },
            { id: 'home', title: '住類', items: ['衛生紙','面紙','濕紙巾','垃圾袋','洗碗精','洗手乳','浴室清潔劑','地板清潔劑','除濕劑','洗衣袋','電池','燈泡'] },
            { id: 'go', title: '行類', items: ['悠遊卡加值','口罩','雨傘','雨衣','水壺','行動電源','充電線','通勤包','鞋墊'] },
            { id: 'edu', title: '育類', items: ['筆記本','原子筆','便利貼','資料夾','隨身碟','滑鼠／鍵盤','電腦配件','線上課程／教材'] },
            { id: 'fun', title: '樂類', items: ['書籍／漫畫','遊戲','影音訂閱','耳機','手作材料','旅遊用品','貓咪零食／喵條'] },
            { id: 'other', title: '其他類', items: ['洗髮精','潤髮乳','沐浴乳','牙膏','牙刷','牙線','洗面乳','卸妝產品','防曬乳','化妝水','保濕精華','乳霜','化妝棉','護唇膏','衛生棉','棉花棒','OK繃'] }
        ];

        const selected = new Map();   // key -> { catId, name }
        const inputs = new Map();     // key -> checkbox
        const counters = {};          // catId -> count element
        const grids = {};             // catId -> grid element

        const totalEl = document.getElementById('total');
        const needEl = document.getElementById('needCount');
        const output = document.getElementById('output');
        const customInput = document.getElementById('customInput');
        const addBtn = document.getElementById('addBtn');
        const copyBtn = document.getElementById('copyBtn');

        function keyOf(catId, name) {
            return catId + '|' + name;
        }

        // ===================== 建立分類卡片 =====================
        function addCheckbox(catId, name, checked) {
            const label = document.createElement('label');
            label.className = 'chk';

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = checked;

            const span = document.createElement('span');
            span.textContent = name;

            label.appendChild(input);
            label.appendChild(span);
            grids[catId].appendChild(label);

            inputs.set(keyOf(catId, name), input);

            input.addEventListener('change', () => {
                setItem(catId, name, input.checked);
            });
        }

        CATALOG.forEach(cat => {
            if (cat.id === 'other') {
                grids[cat.id] = document.getElementById('grid-other');
                counters[cat.id] = document.getElementById('cnt-other');
            } else {
                const card = document.createElement('section');
                card.className = 'panel';

                const head = document.createElement('div');
                head.className = 'panel-head';

                const h2 = document.createElement('h2');
                h2.textContent = cat.title;

                const cnt = document.createElement('span');
                cnt.className = 'cnt';
                cnt.textContent = '0 項';

                head.appendChild(h2);
                head.appendChild(cnt);

                const grid = document.createElement('div');
                grid.className = 'grid';

                card.appendChild(head);
                card.appendChild(grid);
                document.getElementById('catalog').appendChild(card);

                grids[cat.id] = grid;
                counters[cat.id] = cnt;
            }

            cat.items.forEach(name => addCheckbox(cat.id, name, false));
        });

        // ===================== 選取狀態 =====================
        function setItem(catId, name, on) {
            const k = keyOf(catId, name);
            if (on) {
                selected.set(k, { catId, name });
            } else {
                selected.delete(k);
            }
            const box = inputs.get(k);
            if (box) box.checked = on;
            renderList();
        }

        // ===================== 自訂新增（歸入其他類） =====================
        function addCustom() {
            const name = customInput.value.trim();
            if (!name) return;

            const other = CATALOG.find(c => c.id === 'other');
            if (!other.items.includes(name)) {
                other.items.push(name);
                addCheckbox('other', name, true);
            }
            setItem('other', name, true);

            customInput.value = '';
            customInput.focus();
        }

        addBtn.addEventListener('click', addCustom);

        customInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addCustom();
            }
        });

        // ===================== 渲染清單 =====================
        function renderList() {
            CATALOG.forEach(cat => {
                const n = [...selected.values()].filter(s => s.catId === cat.id).length;
                counters[cat.id].textContent = n + ' 項';
            });

            totalEl.textContent = selected.size;
            needEl.textContent = selected.size;

            output.innerHTML = '';

            if (selected.size === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-msg';
                empty.textContent = '尚未選擇物品，勾選下方的項目就會自動整理在這裡。';
                output.appendChild(empty);
                return;
            }

            const ul = document.createElement('ul');
            ul.className = 'chips';

            CATALOG.forEach(cat => {
                [...selected.values()]
                    .filter(s => s.catId === cat.id)
                    .forEach(s => {
                        const li = document.createElement('li');

                        const tag = document.createElement('span');
                        tag.className = 'need-tag';
                        tag.textContent = cat.title.replace('類', '');

                        const name = document.createElement('span');
                        name.textContent = s.name;

                        const del = document.createElement('button');
                        del.type = 'button';
                        del.className = 'btn-x';
                        del.textContent = '✕';
                        del.addEventListener('click', () => setItem(s.catId, s.name, false));

                        li.appendChild(tag);
                        li.appendChild(name);
                        li.appendChild(del);
                        ul.appendChild(li);
                    });
            });

            output.appendChild(ul);
        }

        // ===================== 複製清單 =====================
        copyBtn.addEventListener('click', () => {
            if (selected.size === 0) return;

            let text = '我的購買清單\n';
            CATALOG.forEach(cat => {
                const items = [...selected.values()].filter(s => s.catId === cat.id);
                if (items.length === 0) return;
                text += '\n【' + cat.title + '】\n';
                items.forEach(s => { text += '- ' + s.name + '\n'; });
            });

            const done = () => {
                copyBtn.textContent = '已複製';
                setTimeout(() => copyBtn.textContent = '複製清單', 1500);
            };

            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        });

        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            ta.remove();
        }

        // ===================== 黑貓吉祥物 =====================
        const catEl = document.getElementById('cat');
        const catSvg = document.getElementById('catSvg');
        const bubble = document.getElementById('bubble');
        const orbs = [...document.querySelectorAll('.orb')];

        const CAT_HALF = 100;       // 貓的水平中心
        const CAT_FEET = 152;       // 腳底在 viewBox 內的 y 座標
        const WALK_SPEED = 1.6;
        const FOLLOW_MS = 5000;     // 碰到貓咪後跟隨游標的時間
        const FOLLOW_EASE = 0.1;    // 跟隨的平滑係數

        const jokes = [
            '通膨讓我的存錢罐開始減肥，現在只剩一顆硬幣的體重。',
            '我不是不理財，我是理財到錢包自己離家出走。',
            '定存利率比我的貓罐頭降價速度還慢，喵。',
            '大盤跌我抱著，大盤漲我也抱著，因為我沒錢可以輸。',
            '薪水跟通膨一樣：每年都在漲，但漲的是別人的菜價。',
            '我問 AI 怎麼快速致富，它說：先有一筆錢。我說謝謝，然後關掉了。',
            '我的投資策略很簡單：買的時候很開心，跌的時候很冷靜，賣掉以後才開始後悔。',
            '我不是韭菜，我是長期持有的有機蔬菜。',
            '我的財富自由計畫進度條，目前還在載入中，喵。'
        ];

        let x = innerWidth / 2;
        let y = floorY();
        let state = 'sit';
        let facing = 1;
        let motion = null;          // walk / flight / perch
        let hovering = false;       // 游標是否在貓上
        let follow = false;         // 是否跟隨游標中
        let followUntil = 0;        // 跟隨結束的時間點
        let mouseX = innerWidth / 2;
        let mouseY = innerHeight / 2;
        let timer = null;
        let hideTimer = null;
        let lastJoke = -1;

        document.addEventListener('pointermove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function floorY() {
            return innerHeight - 2;
        }

        function clamp(v, lo, hi) {
            return Math.min(Math.max(v, lo), hi);
        }

        function randInt(a, b) {
            return a + Math.floor(Math.random() * (b - a + 1));
        }

        function pick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function schedule(fn, ms) {
            clearTimeout(timer);
            timer = setTimeout(fn, ms);
        }

        function topOf(orb) {
            const r = orb.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + 2 };
        }

        function nextJoke() {
            let i;
            do {
                i = randInt(0, jokes.length - 1);
            } while (i === lastJoke && jokes.length > 1);
            lastJoke = i;
            return jokes[i];
        }

        function render() {
            catEl.style.transform = `translate(${x - CAT_HALF}px, ${y - CAT_FEET}px)`;
            catSvg.style.transform = `scaleX(${facing})`;
            catEl.dataset.state = state;
        }

        // ===================== 隨機動作 =====================
        function act() {
            if (follow || hovering || motion) return;

            const r = Math.random();
            if (r < 0.32)      walk();
            else if (r < 0.44) rest('sit', randInt(2000, 3500));
            else if (r < 0.56) rest('lie', randInt(3000, 5000));
            else if (r < 0.74) rest('sleep', randInt(6000, 9000));
            else if (r < 0.84) rest('groom', randInt(2500, 3500));
            else               jumpToOrb();
        }

        function rest(s, ms) {
            motion = null;
            state = s;
            schedule(act, ms);
        }

        function walk() {
            const tx = randInt(80, innerWidth - 80);
            facing = Math.sign(tx - x) || 1;
            motion = { type: 'walk', tx };
        }

        function flyTo(getTarget, arc, onLand) {
            motion = {
                type: 'flight',
                sx: x,
                sy: y,
                t0: performance.now(),
                dur: 900,
                arc,
                getTarget,
                onLand
            };
            state = 'jump';
        }

        function jumpToOrb() {
            if (follow || motion || orbs.length === 0) return;
            const orb = pick(orbs);
            flyTo(() => topOf(orb), 170, () => {
                motion = { type: 'perch', orb, end: performance.now() + randInt(5000, 8000) };
                state = hovering ? 'sit' : pick(['sit', 'lie', 'sleep', 'groom']);
            });
        }

        function leaveOrb() {
            const fx = randInt(80, innerWidth - 80);
            flyTo(() => ({ x: fx, y: floorY() }), 90, () => {
                state = 'sit';
                if (!hovering) schedule(act, 600);
            });
        }

        // ===================== 跟隨游標 =====================
        function followStep() {
            const tx = clamp(mouseX, CAT_HALF, innerWidth - CAT_HALF);
            const ty = clamp(mouseY + 40, 160, floorY());
            const dx = tx - x;
            const dy = ty - y;

            x += dx * FOLLOW_EASE;
            y += dy * FOLLOW_EASE;

            if (Math.abs(dx) > 2) facing = Math.sign(dx);
            state = (Math.abs(dx) > 2 || Math.abs(dy) > 2) ? 'walk' : 'sit';
        }

        // 跟隨結束：若還在空中就落回地面，然後恢復自己的動作
        function endFollow() {
            follow = false;
            const cx = x;

            if (Math.abs(y - floorY()) < 2) {
                state = 'sit';
                if (!hovering) schedule(act, 600);
            } else {
                flyTo(() => ({ x: cx, y: floorY() }), 30, () => {
                    state = 'sit';
                    if (!hovering) schedule(act, 600);
                });
            }
        }

        // ===================== 主迴圈 =====================
        function frame(now) {
            if (follow) {
                if (now >= followUntil) {
                    endFollow();
                } else {
                    followStep();
                }
            } else if (motion) {
                const m = motion;

                if (m.type === 'walk') {
                    const dx = m.tx - x;
                    if (Math.abs(dx) <= WALK_SPEED) {
                        x = m.tx;
                        motion = null;
                        state = 'sit';
                        if (!hovering) schedule(act, randInt(400, 1200));
                    } else {
                        const dir = Math.sign(dx);
                        x += dir * WALK_SPEED;
                        facing = dir;
                        state = 'walk';
                    }
                } else if (m.type === 'flight') {
                    const t = Math.min(Math.max((now - m.t0) / m.dur, 0), 1);
                    const e = t * t * (3 - 2 * t);
                    const tg = m.getTarget();
                    x = m.sx + (tg.x - m.sx) * e;
                    y = m.sy + (tg.y - m.sy) * e - Math.sin(Math.PI * t) * m.arc;
                    if (Math.abs(tg.x - m.sx) > 4) facing = Math.sign(tg.x - m.sx);
                    state = 'jump';
                    if (t >= 1) {
                        motion = null;
                        m.onLand();
                    }
                } else if (m.type === 'perch') {
                    const p = topOf(m.orb);
                    x = p.x;
                    y = p.y;
                    if (now >= m.end) leaveOrb();
                }
            }

            render();
            requestAnimationFrame(frame);
        }

        // ===================== 互動 =====================
        catEl.addEventListener('mouseenter', () => {
            hovering = true;
            clearTimeout(timer);
            clearTimeout(hideTimer);

            // 碰到貓咪：停止原本動作，開始跟隨游標 5 秒
            if (!follow) {
                follow = true;
                motion = null;
            }
            followUntil = performance.now() + FOLLOW_MS;

            bubble.textContent = nextJoke();
            bubble.classList.add('show');
        });

        catEl.addEventListener('mouseleave', () => {
            hovering = false;
            hideTimer = setTimeout(() => bubble.classList.remove('show'), 1600);
            if (!follow && !motion) schedule(act, 800);
        });

        catEl.addEventListener('click', () => {
            if (!follow && !motion) {
                clearTimeout(timer);
                jumpToOrb();
            }
        });

        window.addEventListener('resize', () => {
            if (!follow && !motion) y = floorY();
        });

        // ===================== 初始化 =====================
        renderList();
        render();
        schedule(act, 800);
        requestAnimationFrame(frame);
    </script>
</body>
</html>
