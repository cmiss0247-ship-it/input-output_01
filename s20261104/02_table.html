<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 80%;
            margin : auto ;
        }

        tr,
        td{
            /* border: 1px solid black; */
            height: 22vh;
        
        }

        .box {
            width: 100%;
            height: 100%;
        }

        .box1 {
            background-color: rgb(233, 173, 173);
        }

        .box2-1 {
            background-color: rgb(209, 190, 149);
        }

        .box2-2 {
            background-color: rgb(209, 150, 101);
        }

        .box3-1 {
            background-color: rgb(143, 233, 163);
        }

        .box3-2 {
            background-color: rgb(77, 199, 134);
        }

        .box3-3 {
            background-color: rgb(153, 134, 221);
        }

        .box4-1 {
            background-color: rgb(123, 43, 177);
        }

        .box4-2 {
            background-color: rgb(153, 102, 140);
        }

        .box4-3 {
            background-color: rgb(73, 16, 64);
        }

        .box4-4 {
            background-color: rgb(14, 0, 8);
        }
    </style>
</head>
<body>
    <!-- 表格有四個橫排，table tr為一橫排，td為橫排分割格子 -->
    <!-- 第一橫排 -->
    <table>
        <tr>
            <td>
                <div class="box box1"></div>
            </td>
        </tr>
    </table>
    
    <!-- 第二橫排 -->
    <table>
        <tr>
            <td width="50%">
                <div class="box box2-1"></div>
            </td>
            <td>
                <div class="box box2-2"></div>
            </td>
        </tr>
    </table>
    
    <!-- 第三橫排 -->
    <table>
        <tr>
            <td width="33%">
                <div class="box box3-1"></div>
            </td>
            <td width="33%">
                <div class="box box3-2"></div>
            </td>
            <td width="33%">
                <div class="box box3-3"></div>
            </td>
        </tr>
    </table>

    <!-- 第四橫排 -->
    <table>
        <tr>
            <td width="25%">
                <div class="box box4-1"></div>
            </td>
            <td width="25%">
                <div class="box box4-2"></div>
            </td>
            <td width="25%">
                <div class="box box4-3"></div>
            </td>
            <td width="25%">
                <div class="box box4-4"></div>
            </td>
        </tr>
    </table>
    
</body>
</html>
