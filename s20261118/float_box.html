<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STYLE>
        .float-left {
            float: left;
        }

        .float-right {
            float: right;
        }
        
        .clear-both {
            clear: both;
            /* clear: left;
            clear: right; */
        }
        
        .box {
            width: 100%;
            height: 25vh;
            background-color: rgb(149, 0, 255);
        }

        .box11 {
            width: 100%;
            background-color: rgb(111, 0, 214);
        }

        .box21 {
            width: 50%;
            background-color: rgb(79, 0, 153);
        }

        .box22 {
            width: 50%;
            background-color: rgb(50, 0, 97);

        }

        .box31 {
            width: 33%;
            background-color: rgb(30, 0, 58);
        }

        .box32 {
            width: 33%;
            background-color: rgb(40, 0, 77);
        }

        .box33 {
            width: 33%;
            background-color: rgb(0, 0, 0);
        }
    </STYLE>
</head>
<body>
    <div class="box box11">


    </div>  

    <div class="clear-both">
        <div class="box box21 float-left">

        </div>
        <div class="box box22 float-left">

        </div>
    </div>

    <div class="clear-both">
        <div class="box box31 float-left">

        </div>
        <div class="box box32 float-left">

        </div>
        <div class="box box33 float-right">

        </div>
    </div>

    <div class="clear-both">




        <div class="box box33 float-right">

        </div>
    </div>


    <table>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>

        </tr>
    </table>
</body>
</html>
