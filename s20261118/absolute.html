<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: mediumslateblue;

            /* position: fixed; */
            /* right: 0px; */
            /* bottom: 0px; */
            position: relative;
        }


        .box-in-right-top {
            width: 50px;
            height: 50px;
            background-color: deepskyblue;

            position: absolute;
            top: 0px;
            right: 0px;
        }

        .box-in-right-bottom {
            width: 50px;
            height: 50px;
            background-color: hotpink;

            position: absolute;
            bottom: 0px;
            right: 0px;
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="box-in-right-top">

        </div>
        <div class="box-in-right-bottom">

        </div>

    </div>
    
</body>
</html>
