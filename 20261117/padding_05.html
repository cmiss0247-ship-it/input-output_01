<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 寫在*上，代表全部元素都套用box-sizing: border-box規則 */
        *{
            /* 增加padding不會增加,設定padding後盒子不會增加 */
             box-sizing: border-box;
        }
        .box {
            width: 300px;
            height: 300px;
            background-color: aquamarine;

            /* padding-top: 50px; */
            padding-left: 50px;
            padding-right: 50px;
        }

        
</style>
</head>
<body>
    <div class="box">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quo at repellat, repellendus voluptatibus, provident distinctio numquam eum placeat odit ea eveniet perferendis officia porro? Quia cumque quas dignissimos atque! Praesentium.</div>
    

</body>
</html>
