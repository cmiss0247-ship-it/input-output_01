<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
        }

        .box1 {
            background-color: black;
            margin-top: 100px;
            margin-left: 100px;
            margin-bottom: 100px;
        }

        .box2 {
            background-color: purple;
            margin-top: 50px;
            margin-left: 50px;
        }

        .span {
            margin-left: 100px;
        }

        .span2 {
            margin-left: 50px;
        }
</style>
</head>
<body>
    <div class="box box1"></div>

    <div class="box box2"></div>

    <span class="span span1">
        123
    </span>

    <span class="span span2">
        456
    </span>

</body>
</html>
